# Clash Verge Rev YAML 扩展覆写配置
# 放入全局扩展配置或订阅扩展配置；不要放入 JavaScript 编辑器。
# 依赖现有订阅提供节点；地区组固定生成，可能存在空组。
# 国家／地区 > 次区域 > 大洲 > 其他；排除表达式保证地区互斥。
# 替换 rules、proxy-groups，并覆写 DNS；请停用同功能旧脚本。
# 此版本固定使用代理 DoH，不提供无节点时的动态直连回退。

"mode": "rule"
"ipv6": false
"tcp-concurrent": true
"unified-delay": true
"disable-keep-alive": false
"keep-alive-idle": 30
"keep-alive-interval": 15
"profile":
  "store-selected": true
  "store-fake-ip": true
"dns":
  "enable": true
  "ipv6": false
  "listen": "127.0.0.1:1053"
  "enhanced-mode": "fake-ip"
  "fake-ip-range": "198.18.0.1/16"
  "fake-ip-filter-mode": "blacklist"
  "prefer-h3": false
  "respect-rules": false
  "cache-algorithm": "arc"
  "default-nameserver":
    - "114.114.114.114"
    - "223.5.5.5"
  "proxy-server-nameserver":
    - "114.114.114.114"
    - "223.5.5.5"
  "direct-nameserver":
    - "114.114.114.114"
    - "223.5.5.5"
  "direct-nameserver-follow-policy": false
  "nameserver-policy":
    "geosite:cn":
      - "114.114.114.114"
      - "223.5.5.5"
    "geosite:private": "system"
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query#代理"
  "nameserver":
    - "https://1.1.1.1/dns-query#代理"
  "fallback": []
  "fake-ip-filter":
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.home.arpa"
    - "*.internal"
    - "localhost"
    - "*.localdomain"
    - "time.windows.com"
    - "time.apple.com"
    - "time.cloudflare.com"
    - "ntp.*"
    - "*.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "*.stun.*"
    - "stun.*.*"
"proxy-groups":
  -
    "include-all": true
    "exclude-filter": "(?i)流量|剩余|到期|过期|重置|订阅|套餐|官网|客服|频道|维护|Traffic|Expire|Expired|Premium"
    "name": "代理"
    "type": "select"
    "proxies":
      - "所有节点自动测速"
      - "所有节点故障转移"
      - "所有节点哈希均衡"
      - "香港自动测速"
